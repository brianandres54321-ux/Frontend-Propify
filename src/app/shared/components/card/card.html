<div class="card card--{{ variante() }}">
  @if (titulo()) {
    <div class="card-header">
      @if (icono()) {
        <span class="card__icono">
          <i class="bi bi-{{ icono() }}"></i>
        </span>
      }
      <span>{{ titulo() }}</span>
    </div>
  }
  <div class="card-body">
    <ng-content />
  </div>
  @if (tieneFooter()) {
    <div class="card-footer bg-body">
      <ng-content select="[card-footer]" />
    </div>
  }
</div>
