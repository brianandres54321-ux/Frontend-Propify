@if (totalPaginas() > 1) {
  <nav aria-label="Paginación" class="d-flex justify-content-between align-items-center mt-3">
    <span class="text-muted small">
      {{ inicioRango() }}–{{ finRango() }} de {{ totalItems() }}
    </span>

    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="paginaActual() === 1">
        <button type="button" class="page-link" (click)="irA(paginaActual() - 1)">Anterior</button>
      </li>
      @for (pagina of paginasVisibles(); track pagina) {
        <li class="page-item" [class.active]="pagina === paginaActual()">
          <button type="button" class="page-link" (click)="irA(pagina)">{{ pagina }}</button>
        </li>
      }
      <li class="page-item" [class.disabled]="paginaActual() === totalPaginas()">
        <button type="button" class="page-link" (click)="irA(paginaActual() + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
}
