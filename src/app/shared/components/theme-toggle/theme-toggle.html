<button
  type="button"
  class="theme-toggle"
  (click)="alternar()"
  [title]="themeService.tema() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
>
  <i
    class="bi"
    [class.bi-sun-fill]="themeService.tema() === 'dark'"
    [class.bi-moon-stars-fill]="themeService.tema() === 'light'"
  ></i>
</button>
