<div class="modal-header">
  <h2 class="modal-title fs-5">{{ titulo }}</h2>
  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <p class="mb-0">{{ mensaje }}</p>
</div>

<div class="modal-footer">
  <app-button variant="secondary" [fullWidth]="false" (click)="activeModal.dismiss()">
    {{ textoCancelar }}
  </app-button>
  <app-button variant="primary" [fullWidth]="false" (click)="activeModal.close(true)">
    {{ textoConfirmar }}
  </app-button>
</div>
