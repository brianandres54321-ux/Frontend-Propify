<div class="auth-card">
  <p class="auth-card__kicker">Empieza gratis</p>
  <h1 class="h3">Crea tu cuenta</h1>
  <p class="text-muted small mb-4">Registra tu conjunto o edificio en Propify.</p>

  @if (errorMensaje()) {
    <app-alert variant="danger">{{ errorMensaje() }}</app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="enviar()" class="registro-form">
    <app-text-field
      label="Nombre del conjunto o edificio"
      [error]="
        form.controls.nombreTenant.touched && form.controls.nombreTenant.invalid
          ? 'Ingresa un nombre de al menos 2 caracteres'
          : null
      "
    >
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="form.controls.nombreTenant.touched && form.controls.nombreTenant.invalid"
        formControlName="nombreTenant"
        autocomplete="organization"
      />
    </app-text-field>

    <app-text-field
      label="Correo"
      [error]="
        form.controls.correoUsuario.touched && form.controls.correoUsuario.invalid
          ? 'Ingresa un correo válido'
          : null
      "
    >
      <input
        type="email"
        class="form-control"
        [class.is-invalid]="form.controls.correoUsuario.touched && form.controls.correoUsuario.invalid"
        formControlName="correoUsuario"
        autocomplete="email"
      />
    </app-text-field>

    <div class="mb-3 registro-form__full">
      <label class="form-label">¿Qué vas a administrar?</label>
      <div class="d-flex gap-2">
        @for (opcion of opcionesPlan; track opcion.valor) {
          <label class="plan-opcion flex-fill" [class.plan-opcion--activa]="form.controls.plan.value === opcion.valor">
            <input
              type="radio"
              class="btn-check"
              name="plan"
              [value]="opcion.valor"
              formControlName="plan"
            />
            <span class="d-block fw-semibold">{{ opcion.titulo }}</span>
            <span class="d-block small text-muted">{{ opcion.descripcion }}</span>
          </label>
        }
      </div>
    </div>

    <app-text-field
      label="Tu nombre"
      [error]="
        form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid
          ? 'Ingresa un nombre de al menos 2 caracteres'
          : null
      "
    >
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid"
        formControlName="nombreUsuario"
        autocomplete="name"
      />
    </app-text-field>

    <app-text-field
      label="Celular"
      [hint]="telefonoHint"
      [error]="
        form.controls.telefono.touched && form.controls.telefono.invalid
          ? telefonoHint
          : null
      "
    >
      <input
        type="tel"
        class="form-control"
        [class.is-invalid]="form.controls.telefono.touched && form.controls.telefono.invalid"
        formControlName="telefono"
        autocomplete="tel"
        placeholder="3001234567"
      />
    </app-text-field>

    <app-text-field
      label="Contraseña"
      [hint]="passwordHint"
      [error]="
        form.controls.claveAcceso.touched && form.controls.claveAcceso.invalid
          ? passwordHint
          : null
      "
    >
      <div class="password-input">
        <input
          [type]="mostrarClave() ? 'text' : 'password'"
          class="form-control"
          [class.is-invalid]="form.controls.claveAcceso.touched && form.controls.claveAcceso.invalid"
          formControlName="claveAcceso"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="password-input__toggle"
          (click)="mostrarClave.set(!mostrarClave())"
          [title]="mostrarClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <i class="bi" [class.bi-eye]="!mostrarClave()" [class.bi-eye-slash]="mostrarClave()"></i>
        </button>
      </div>
    </app-text-field>

    <app-text-field
      label="Confirmar contraseña"
      [error]="
        form.controls.confirmarClave.touched && form.errors?.['passwordsNoCoinciden']
          ? 'Las contraseñas no coinciden'
          : null
      "
    >
      <div class="password-input">
        <input
          [type]="mostrarConfirmar() ? 'text' : 'password'"
          class="form-control"
          [class.is-invalid]="form.controls.confirmarClave.touched && form.errors?.['passwordsNoCoinciden']"
          formControlName="confirmarClave"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="password-input__toggle"
          (click)="mostrarConfirmar.set(!mostrarConfirmar())"
          [title]="mostrarConfirmar() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <i class="bi" [class.bi-eye]="!mostrarConfirmar()" [class.bi-eye-slash]="mostrarConfirmar()"></i>
        </button>
      </div>
    </app-text-field>

    <app-button type="submit" [loading]="enviando()" [disabled]="form.invalid" class="registro-form__full">
      Crear cuenta
    </app-button>
  </form>

  <p class="text-muted small mt-3 mb-0">
    ¿Ya tienes cuenta? <a routerLink="/login">Ingresar</a>
  </p>
</div>
