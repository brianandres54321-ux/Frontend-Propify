<div class="auth-layout" [class.auth-layout--invertido]="esRegistro()">
  <aside class="auth-layout__brand">
    <img class="auth-layout__foto" src="/images/proyecto-conjunto.jpg" alt="" aria-hidden="true" />
    <div class="auth-layout__velo"></div>

    <a routerLink="/" class="auth-layout__marca">Propify</a>

    <div class="auth-layout__centro" [class.auth-layout__centro--pulso]="pulso()">
      <span class="auth-layout__insignia">
        <i class="bi bi-house-door-fill"></i>
      </span>
      <p class="auth-layout__eslogan">Administración de propiedades</p>
      <h1 class="auth-layout__titulo">Propify</h1>
      <p class="auth-layout__subtitulo">Cobranza, residentes y portería en un solo lugar</p>
    </div>

    <p class="auth-layout__copyright">© {{ anio }} Propify. Todos los derechos reservados.</p>
  </aside>

  <div class="auth-layout__contenido">
    <router-outlet />
  </div>
</div>
