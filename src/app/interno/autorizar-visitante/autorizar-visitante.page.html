<h1 class="h3 mb-4">Autorizar visitante</h1>

<p class="text-muted mb-4">
  Autoriza a alguien que va a visitarte dentro de una ventana de tiempo — portería
  lo verá en su pantalla y podrá dejarlo pasar sin llamarte a confirmar.
</p>

@if (errorEnvio()) {
  <app-alert variant="danger">{{ errorEnvio() }}</app-alert>
}
@if (enviado()) {
  <app-alert variant="success">Autorización registrada correctamente.</app-alert>
}

<form [formGroup]="formulario" (ngSubmit)="enviar()" class="autorizacion-form">
  <app-text-field
    label="Nombre de quien esperas"
    [error]="formulario.controls.nombreEsperado.touched && formulario.controls.nombreEsperado.invalid ? 'El nombre es obligatorio.' : null"
  >
    <input type="text" class="form-control" formControlName="nombreEsperado" placeholder="Ej: Carlos Pérez" />
  </app-text-field>

  <app-text-field label="Notas (opcional)">
    <textarea class="form-control" rows="2" formControlName="notas" placeholder="Ej: viene en un carro gris"></textarea>
  </app-text-field>

  <div class="row g-3">
    <div class="col-12 col-sm-6">
      <app-text-field
        label="Desde"
        [error]="formulario.controls.ventanaInicio.touched && formulario.controls.ventanaInicio.invalid ? 'Obligatorio.' : null"
      >
        <input type="datetime-local" class="form-control" formControlName="ventanaInicio" />
      </app-text-field>
    </div>
    <div class="col-12 col-sm-6">
      <app-text-field
        label="Hasta"
        [error]="formulario.controls.ventanaFin.touched && formulario.controls.ventanaFin.invalid ? 'Obligatorio.' : null"
      >
        <input type="datetime-local" class="form-control" formControlName="ventanaFin" />
      </app-text-field>
    </div>
  </div>

  <app-button type="submit" [fullWidth]="false" [loading]="enviando()">Autorizar visitante</app-button>
</form>
