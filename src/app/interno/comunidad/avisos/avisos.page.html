<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Avisos</h1>
  @if (puedeGestionar()) {
    <app-button
      icono="plus-lg"
      [fullWidth]="false"
      [disabled]="!inmuebleSeleccionado()"
      (click)="abrirCrear()"
    >
      Nuevo aviso
    </app-button>
  }
</div>

@if (errorMensaje()) {
  <app-alert variant="danger">{{ errorMensaje() }}</app-alert>
}

<form class="row mb-3">
  <div class="col-6 col-md-3">
    <select
      class="form-select"
      [value]="inmuebleSeleccionado()"
      (change)="cambiarInmueble($any($event.target).value)"
    >
      @for (inmueble of inmuebles(); track inmueble.codInmueble) {
        <option [value]="inmueble.codInmueble">{{ inmueble.nombre }}</option>
      }
    </select>
  </div>
</form>

@if (cargando()) {
  <app-loading />
} @else if (!inmuebleSeleccionado()) {
  <p class="text-muted">Ninguno de tus inmuebles tiene el módulo de cartelera activo.</p>
} @else {
  <app-table
    [columnas]="columnas"
    [filas]="avisos()"
    textoVacio="No hay avisos publicados para este inmueble."
  />
}
