<nav aria-label="breadcrumb" class="mb-2">
  <ol class="breadcrumb small">
    <li class="breadcrumb-item"><a routerLink="/app/inmuebles">Inmuebles</a></li>
    <li class="breadcrumb-item">
      <a [routerLink]="['/app/inmuebles', inmuebleId, 'unidades']">Unidades</a>
    </li>
    <li class="breadcrumb-item active">Inquilinos</li>
  </ol>
</nav>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Inquilinos</h1>
  @if (puedeGestionar()) {
    <app-button icono="plus-lg" [fullWidth]="false" (click)="abrirCrear()"
      >Nuevo inquilino</app-button
    >
  }
</div>

@if (errorMensaje()) {
  <app-alert variant="danger">{{ errorMensaje() }}</app-alert>
}

@if (cargando()) {
  <app-loading />
} @else {
  <app-table
    [columnas]="columnas"
    [filas]="filasPagina()"
    textoVacio="Todavía no hay inquilinos registrados en esta unidad."
  >
    <ng-template let-fila>
      @if (puedeGestionar()) {
        <div class="d-flex gap-2 justify-content-end flex-wrap">
          <app-button
            variant="icon"
            color="info"
            icono="eye"
            title="Ver detalle"
            [routerLink]="[
              '/app/inmuebles',
              inmuebleId,
              'unidades',
              unidadId,
              'residentes',
              fila.codResidente,
            ]"
          />
          @if (fila.archivoContrato) {
            <app-button
              variant="icon"
              color="info"
              icono="file-earmark-text"
              title="Ver contrato"
              (click)="descargarContrato(fila)"
            />
          }
          <input
            type="file"
            accept=".pdf,.doc,.docx"
            hidden
            #inputContrato
            (change)="subirContrato(fila, inputContrato)"
          />
          <app-button
            variant="icon"
            color="primary"
            icono="cloud-upload"
            [title]="fila.archivoContrato ? 'Reemplazar contrato' : 'Subir contrato'"
            (click)="inputContrato.click()"
          />
          <app-button
            variant="icon"
            color="primary"
            icono="pencil-square"
            title="Editar"
            (click)="abrirEditar(fila)"
          />
          <app-button
            variant="icon"
            color="danger"
            icono="trash"
            title="Eliminar"
            (click)="eliminar(fila)"
          />
        </div>
      }
    </ng-template>
  </app-table>

  <app-pagination
    [totalItems]="residentes().length"
    [paginaActual]="paginaActual()"
    [tamanioPagina]="TAMANIO_PAGINA"
    (paginaCambio)="paginaActual.set($event)"
  />
}
