<div class="modal-header">
  <h2 class="modal-title fs-5">{{ modo === 'crear' ? 'Nuevo inquilino' : 'Editar inquilino' }}</h2>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="enviar()">
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6">
        <app-text-field
          label="Nombre"
          [error]="form.controls.nombre.touched && form.controls.nombre.invalid ? 'Ingresa un nombre' : null"
        >
          <input
            type="text"
            class="form-control"
            [class.is-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid"
            formControlName="nombre"
          />
        </app-text-field>
      </div>
      <div class="col-md-6">
        <app-text-field
          label="Correo"
          hint="Obligatorio: por aquí le llegan los recordatorios de pago y avisos de mora"
          [error]="form.controls.correo.touched && form.controls.correo.invalid ? 'Ingresa un correo válido' : null"
        >
          <input
            type="email"
            class="form-control"
            [class.is-invalid]="form.controls.correo.touched && form.controls.correo.invalid"
            formControlName="correo"
          />
        </app-text-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <app-text-field
          label="Teléfono (celular)"
          [error]="form.controls.telefono.touched && form.controls.telefono.invalid ? 'Debe tener 10 dígitos' : null"
        >
          <input
            type="tel"
            inputmode="numeric"
            maxlength="10"
            class="form-control"
            [class.is-invalid]="form.controls.telefono.touched && form.controls.telefono.invalid"
            formControlName="telefono"
          />
        </app-text-field>
      </div>
      <div class="col-md-6">
        <app-text-field label="Cédula (opcional)">
          <input type="text" class="form-control" formControlName="cedula" />
        </app-text-field>
      </div>
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="esPropietario" formControlName="esPropietario" />
      <label class="form-check-label" for="esPropietario">Es propietario (no arrienda)</label>
    </div>

    <div class="row">
      <div class="col-md-6">
        <app-text-field
          label="Valor mensual"
          hint="Cuánto paga cada mes"
          [error]="form.controls.valorMensual.touched && form.controls.valorMensual.invalid ? 'Ingresa un monto válido' : null"
        >
          <input
            type="text"
            inputmode="numeric"
            appMoneda
            class="form-control"
            [class.is-invalid]="form.controls.valorMensual.touched && form.controls.valorMensual.invalid"
            formControlName="valorMensual"
          />
        </app-text-field>
      </div>
      <div class="col-md-6">
        <app-text-field
          label="Día de pago"
          hint="1 al 31"
          [error]="form.controls.diaPago.touched && form.controls.diaPago.invalid ? 'Ingresa un día entre 1 y 31' : null"
        >
          <input
            type="number"
            min="1"
            max="31"
            class="form-control"
            [class.is-invalid]="form.controls.diaPago.touched && form.controls.diaPago.invalid"
            formControlName="diaPago"
          />
        </app-text-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <app-text-field label="Fecha de inicio">
          <input type="date" class="form-control" formControlName="fechaInicio" />
        </app-text-field>
      </div>
      <div class="col-md-6">
        <app-text-field label="Duración del contrato">
          <select class="form-select" formControlName="duracionContrato">
            @for (opcion of opcionesDuracion; track opcion.valor) {
              <option [value]="opcion.valor">{{ opcion.etiqueta }}</option>
            }
          </select>
        </app-text-field>
      </div>
    </div>

    @if (form.controls.duracionContrato.value) {
      <div class="row">
        <div class="col-md-6">
          <app-text-field label="Fecha de fin">
            <input type="date" class="form-control" formControlName="fechaFin" />
          </app-text-field>
        </div>
      </div>
    }
  </div>

  <div class="modal-footer">
    <app-button variant="secondary" [fullWidth]="false" type="button" (click)="activeModal.dismiss()">
      Cancelar
    </app-button>
    <app-button variant="primary" [fullWidth]="false" type="submit" [disabled]="form.invalid">
      Guardar
    </app-button>
  </div>
</form>
