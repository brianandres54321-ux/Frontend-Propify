<div class="modal-header">
  <h2 class="modal-title fs-5">{{ modoEdicion ? 'Editar cliente' : 'Nuevo cliente' }}</h2>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="enviar()">
  <div class="modal-body">
    <app-text-field
      label="Nombre del cliente"
      [error]="form.controls.nombre.touched && form.controls.nombre.invalid ? 'Ingresa un nombre (mínimo 2 caracteres)' : null"
    >
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid"
        formControlName="nombre"
      />
    </app-text-field>

    <app-text-field
      label="Plan"
      [hint]="'Límites del plan: ' + limitesDelPlan.inmuebles + ' inmueble(s) · ' + limitesDelPlan.unidades + ' unidades'"
    >
      <select class="form-select" formControlName="plan">
        <option [value]="PlanTipo.CASAS">Casas</option>
        <option [value]="PlanTipo.EDIFICIOS">Edificios</option>
        <option [value]="PlanTipo.CONJUNTOS">Conjuntos</option>
      </select>
    </app-text-field>

    @if (modoEdicion) {
      <div class="form-check mb-2">
        <input type="checkbox" class="form-check-input" id="pagado" formControlName="pagado" />
        <label class="form-check-label" for="pagado">
          Plan pagado <span class="text-muted">(si está apagado, aplican los límites del demo: 1 inmueble, 5 unidades)</span>
        </label>
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="activo" formControlName="activo" />
        <label class="form-check-label" for="activo">Cliente activo</label>
      </div>

      <p class="form-label fs-6 mb-1">Límite manual (opcional)</p>
      <p class="form-text mt-0 mb-2">
        Deja vacío para usar el límite del plan. Pon un número para subírselo (o bajárselo) a este cliente en concreto.
      </p>
      <div class="row">
        <div class="col-6">
          <app-text-field label="Inmuebles">
            <input type="number" min="1" class="form-control" formControlName="limiteInmuebles" placeholder="Plan" />
          </app-text-field>
        </div>
        <div class="col-6">
          <app-text-field label="Unidades">
            <input type="number" min="1" class="form-control" formControlName="limiteUnidades" placeholder="Plan" />
          </app-text-field>
        </div>
      </div>
    }
  </div>

  <div class="modal-footer">
    <app-button variant="secondary" [fullWidth]="false" type="button" (click)="activeModal.dismiss()">
      Cancelar
    </app-button>
    <app-button variant="primary" [fullWidth]="false" type="submit" [disabled]="form.invalid">
      Guardar
    </app-button>
  </div>
</form>
