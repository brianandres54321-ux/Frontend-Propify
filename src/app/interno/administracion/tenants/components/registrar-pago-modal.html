<div class="modal-header">
  <h2 class="modal-title fs-5">Registrar pago</h2>
  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<form [formGroup]="form" (ngSubmit)="enviar()">
  <div class="modal-body">
    <p class="text-muted small">
      Cliente: <strong>{{ tenant.nombre }}</strong
      >. Al guardar, el cliente pasa a <strong>plan pagado</strong> con los límites del plan
      elegido.
    </p>

    <app-text-field label="Plan contratado">
      <select class="form-select" formControlName="plan">
        <option [value]="PlanTipo.CASAS">Casas</option>
        <option [value]="PlanTipo.EDIFICIOS">Edificios</option>
        <option [value]="PlanTipo.CONJUNTOS">Conjuntos</option>
      </select>
    </app-text-field>

    <div class="row">
      <div class="col-6">
        <app-text-field
          label="Fecha de pago"
          [error]="
            form.controls.fechaPago.touched && form.controls.fechaPago.invalid ? 'Requerida' : null
          "
        >
          <input type="date" class="form-control" formControlName="fechaPago" />
        </app-text-field>
      </div>
      <div class="col-6">
        <app-text-field
          label="Monto (COP)"
          [error]="
            form.controls.montoPago.touched && form.controls.montoPago.invalid
              ? 'Ingresa un monto'
              : null
          "
        >
          <input
            type="number"
            min="0"
            step="1000"
            class="form-control"
            formControlName="montoPago"
          />
        </app-text-field>
      </div>
    </div>

    <app-text-field label="Método de pago">
      <select class="form-select" formControlName="metodoPago">
        @for (m of metodos; track m) {
          <option [value]="m">{{ m }}</option>
        }
      </select>
    </app-text-field>

    <app-text-field label="Referencia / comprobante (opcional)">
      <input
        type="text"
        class="form-control"
        formControlName="referenciaPago"
        placeholder="Nº de transacción, últimos dígitos…"
      />
    </app-text-field>
  </div>

  <div class="modal-footer">
    <app-button
      variant="secondary"
      [fullWidth]="false"
      type="button"
      (click)="activeModal.dismiss()"
    >
      Cancelar
    </app-button>
    <app-button variant="primary" [fullWidth]="false" type="submit" [disabled]="form.invalid">
      Registrar pago y activar
    </app-button>
  </div>
</form>
