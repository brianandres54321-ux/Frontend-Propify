<div class="modal-header">
  <h2 class="modal-title fs-5">{{ modoEdicion ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="enviar()">
  <div class="modal-body">
    <app-text-field
      label="Nombre"
      [error]="form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid ? 'Ingresa un nombre' : null"
    >
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid"
        formControlName="nombreUsuario"
      />
    </app-text-field>

    <app-text-field
      label="Correo"
      [error]="form.controls.correoUsuario.touched && form.controls.correoUsuario.invalid ? 'Ingresa un correo válido' : null"
    >
      <input
        type="email"
        class="form-control"
        [class.is-invalid]="form.controls.correoUsuario.touched && form.controls.correoUsuario.invalid"
        formControlName="correoUsuario"
      />
    </app-text-field>

    <app-text-field
      [label]="modoEdicion ? 'Nueva contraseña (opcional)' : 'Contraseña'"
      [hint]="
        modoEdicion
          ? 'Déjala vacía para no cambiarla. Si la cambias: mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.'
          : 'Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.'
      "
      [error]="form.controls.claveAcceso.touched && form.controls.claveAcceso.invalid ? 'La contraseña no cumple el formato requerido' : null"
    >
      <input
        type="password"
        class="form-control"
        autocomplete="new-password"
        [class.is-invalid]="form.controls.claveAcceso.touched && form.controls.claveAcceso.invalid"
        formControlName="claveAcceso"
      />
    </app-text-field>

    <app-text-field
      label="Rol"
      [error]="form.controls.codRol.touched && form.controls.codRol.invalid ? 'Selecciona un rol' : null"
    >
      <select
        class="form-select"
        [class.is-invalid]="form.controls.codRol.touched && form.controls.codRol.invalid"
        formControlName="codRol"
      >
        <option [ngValue]="null">Selecciona un rol</option>
        @for (rol of roles; track rol.codRol) {
          <option [ngValue]="rol.codRol">{{ etiquetaRol(rol.nombreRol) }}</option>
        }
      </select>
    </app-text-field>
  </div>

  <div class="modal-footer">
    <app-button variant="secondary" [fullWidth]="false" type="button" (click)="activeModal.dismiss()">
      Cancelar
    </app-button>
    <app-button variant="primary" [fullWidth]="false" type="submit" [disabled]="form.invalid">
      Guardar
    </app-button>
  </div>
</form>
