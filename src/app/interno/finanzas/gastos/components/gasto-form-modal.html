<div class="modal-header">
  <h2 class="modal-title fs-5">{{ modo === 'crear' ? 'Nuevo gasto' : 'Editar gasto' }}</h2>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="enviar()">
  <div class="modal-body">
    <app-text-field
      label="Concepto"
      [error]="form.controls.concepto.touched && form.controls.concepto.invalid ? 'Ingresa un concepto' : null"
    >
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="form.controls.concepto.touched && form.controls.concepto.invalid"
        formControlName="concepto"
      />
    </app-text-field>

    <app-text-field
      label="Monto"
      [error]="form.controls.monto.touched && form.controls.monto.invalid ? 'Ingresa un monto válido' : null"
    >
      <input
        type="text"
        inputmode="numeric"
        appMoneda
        class="form-control"
        [class.is-invalid]="form.controls.monto.touched && form.controls.monto.invalid"
        formControlName="monto"
      />
    </app-text-field>

    <div class="row">
      <div class="col-6">
        <app-text-field label="Fecha">
          <input type="date" class="form-control" formControlName="fecha" />
        </app-text-field>
      </div>
      <div class="col-6">
        <app-text-field label="Categoría (opcional)">
          <input type="text" class="form-control" formControlName="categoria" />
        </app-text-field>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <app-button variant="secondary" [fullWidth]="false" type="button" (click)="activeModal.dismiss()">
      Cancelar
    </app-button>
    <app-button variant="primary" [fullWidth]="false" type="submit" [disabled]="form.invalid">
      Guardar
    </app-button>
  </div>
</form>
